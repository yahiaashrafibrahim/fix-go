<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Fix&Go — automotive parts, fitment, garage, AI, mechanics, installation and maintenance."><title>Fix&Go — Automotive Marketplace</title><style>
:root{--orange:#f97316;--orange-dark:#d95f0b;--ink:#18212a;--muted:#66727d;--line:#e5e9ed;--bg:#f7f8fa;--white:#fff;--green:#11824b;--soft:#fff2e7;--shadow:0 18px 50px rgba(24,33,42,.09)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.top{background:#20262d;color:#fff;text-align:center;padding:9px;font-size:12px}.nav{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:0 5%;position:sticky;top:0;z-index:20}.logo{width:122px;height:auto;object-fit:contain}.search{flex:1;max-width:650px;display:flex;border:2px solid var(--orange);border-radius:10px;overflow:hidden;background:#fff}.search input{flex:1;border:0;padding:12px 14px;outline:0}.search button{border:0;background:var(--orange);color:#fff;padding:0 18px;font-weight:800}.navlinks{display:flex;gap:13px;align-items:center;font-size:14px;white-space:nowrap}.navlinks button{border:0;background:none}.pill{border:1px solid var(--line)!important;padding:9px 12px;border-radius:9px;background:#fff!important}.page{display:none}.page.active{display:block}.hero{background:#fff;padding:64px 5% 50px;border-bottom:1px solid var(--line)}.hero-inner{max-width:1400px;margin:auto;display:grid;grid-template-columns:1.15fr .85fr;gap:50px;align-items:center}.eyebrow,.tag{display:inline-block;background:var(--soft);color:#c45108;border:1px solid #ffd6b8;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.08em}.hero h1{font-size:clamp(44px,5.4vw,74px);line-height:.98;letter-spacing:-.05em;margin:18px 0}.hero h1 span{color:var(--orange)}.hero p{font-size:18px;color:var(--muted);line-height:1.55;max-width:680px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:850;letter-spacing:.01em}.primary{background:var(--orange);color:#fff}.primary:hover{background:var(--orange-dark)}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.vehicle-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:23px;box-shadow:var(--shadow)}.vehicle-card h3{margin:0 0 5px}.sub,.muted{font-size:13px;color:var(--muted)}.vehicle-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.vehicle-grid select,.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d9e0e5;border-radius:9px;background:#fff;outline:none}.section{padding:48px 5%}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}.section h2{font-size:31px;margin:0 0 7px;letter-spacing:-.025em}.quick,.services,.plans,.products{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.quick-card,.service,.plan,.product,.account-card,.detail-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.quick-card{cursor:pointer;transition:.15s}.quick-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.quick-card p,.service p,.plan p{color:var(--muted);font-size:13px;line-height:1.5}.iconbox{width:42px;height:42px;display:grid;place-items:center;background:var(--soft);border-radius:10px;margin-bottom:14px}.product{padding:0;overflow:hidden}.product img{width:100%;height:185px;object-fit:cover;background:#f1f3f5}.product-body{padding:15px}.brand{font-size:11px;font-weight:850;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.product h3{font-size:16px;margin:7px 0}.stars{color:#e98b00;font-size:13px}.stars span{color:var(--muted)}.price{font-size:20px;font-weight:900;margin-top:9px}.old{text-decoration:line-through;color:#8a939b;font-size:12px;margin-left:6px}.fitbox{margin-top:10px;padding:8px 10px;border-radius:8px;background:#eef9f3;color:var(--green);font-size:12px;font-weight:750}.wide-banner{background:var(--orange);color:#fff;border-radius:20px;padding:28px;display:flex;justify-content:space-between;align-items:center;gap:20px}.wide-banner p{opacity:.9}.catalog{display:grid;grid-template-columns:240px 1fr;gap:20px;padding:30px 5%}.filters{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;height:max-content}.filter-group{border-top:1px solid var(--line);padding:14px 0}.filter-group:first-child{border-top:0}.filter-group label{display:block;font-size:13px;margin:7px 0}.filter-group input[type=checkbox]{margin-right:7px}.sortbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px;align-items:center}.sortbar select{padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff}.detail{padding:45px 5%;display:grid;grid-template-columns:1fr 1fr;gap:35px;max-width:1300px;margin:auto}.detail-img{width:100%;height:520px;object-fit:cover;border-radius:20px;background:#eee}.detail-card{padding:25px}.detail-card h1{font-size:40px;letter-spacing:-.04em;margin:10px 0}.bigprice{font-size:34px;font-weight:900;margin:18px 0}.list{padding-left:19px;color:var(--muted);line-height:1.9}.plan{position:relative}.plan.recommended{border:2px solid var(--orange);box-shadow:var(--shadow)}.recommended-tag{position:absolute;right:15px;top:15px;background:var(--orange);color:#fff;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:900}.plan h3{margin:12px 0}.price-lg{font-size:31px;font-weight:900}.annual{font-size:12px;color:var(--muted);margin-bottom:13px}.service{min-height:220px}.service .price-line{font-weight:850;margin:12px 0}.account-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.messages{height:390px;overflow:auto;border:1px solid var(--line);border-radius:15px;background:#fff;padding:15px}.msg{max-width:78%;padding:11px 13px;border-radius:12px;margin:8px 0;font-size:14px;line-height:1.45}.msg.user{margin-left:auto;background:var(--orange);color:#fff}.msg.bot{background:#f0f2f4}.ai-row{display:flex;gap:8px;margin-top:10px}.ai-row input{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.table th,.table td{padding:12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}.status{font-weight:800;color:var(--green)}.footer{padding:38px 5%;background:#20262d;color:#b7c0c8}.footer img{width:110px;filter:brightness(0) invert(1);opacity:.95}.toast{position:fixed;right:18px;bottom:18px;background:#20262d;color:#fff;padding:12px 15px;border-radius:10px;display:none;z-index:50;box-shadow:var(--shadow)}.mobile-nav{display:none}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed #cfd6dc;border-radius:14px;background:#fff}.notice{padding:11px 13px;border-radius:10px;background:#fff7ef;border:1px solid #ffd8b9;color:#8c470e;font-size:13px;margin:10px 0}
@media(max-width:1050px){.hero-inner,.detail{grid-template-columns:1fr}.products,.quick,.services,.plans{grid-template-columns:repeat(2,1fr)}.navlinks{display:none}.catalog{grid-template-columns:210px 1fr}.account-grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.nav{height:65px;padding:0 14px}.logo{width:98px}.search{display:none}.hero{padding:35px 16px 30px}.hero h1{font-size:43px}.section{padding:32px 16px}.catalog{display:block;padding:20px 16px}.filters{display:none}.products,.quick,.services,.plans,.account-grid{grid-template-columns:1fr 1fr}.product img{height:145px}.detail{padding:25px 16px}.detail-img{height:330px}.detail-card h1{font-size:30px}.wide-banner{flex-direction:column;align-items:flex-start}.vehicle-grid{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;justify-content:space-around;padding:8px 4px}.mobile-nav button{border:0;background:none;font-size:10px;color:var(--muted)}.mobile-nav b{display:block;font-size:17px;color:var(--ink);margin-bottom:2px}.footer{padding-bottom:75px}.sortbar{align-items:flex-start;flex-direction:column}}
@media(max-width:430px){.products,.quick,.services,.plans{grid-template-columns:1fr}.actions{flex-direction:column}.actions .btn{width:100%}}
</style></head><body><div class="top">Free delivery on qualifying orders • Vehicle compatibility checked before you buy</div><header class="nav"><button class="pill" onclick="navigate('/')"><img class="logo" src="/logo.png" alt="Fix&Go"></button><div class="search"><input id="globalSearch" placeholder="Search car parts, brands, part numbers..." onkeydown="if(event.key==='Enter')loadParts(this.value)"><button onclick="loadParts(document.getElementById('globalSearch').value)">Search</button></div><nav class="navlinks"><button onclick="navigate('/parts')">Parts</button><button onclick="navigate('/garage')">Garage</button><button onclick="navigate('/ai-assistant')">AI Assistant</button><button onclick="navigate('/maintenance')">Maintenance</button><button onclick="navigate('/maintenance/plans')">Plans</button><button onclick="navigate('/cart')">Cart <b id="cartCount">0</b></button><button class="pill" onclick="navigate('/account')">Account</button></nav></header><main id="app"></main><footer class="footer"><img src="/logo.png" alt="Fix&Go"><div style="margin-top:10px">Parts • Fitment • Garage • AI • Mechanics • Installation • Maintenance</div><div style="margin-top:15px;font-size:12px">© 2026 Fix&Go • Development mode adapters enabled until production integrations are configured.</div></footer><div class="mobile-nav"><button onclick="navigate('/')"><b>⌂</b>Home</button><button onclick="navigate('/parts')"><b>▦</b>Parts</button><button onclick="navigate('/ai-assistant')"><b>✦</b>AI</button><button onclick="navigate('/maintenance')"><b>⚙</b>Services</button><button onclick="navigate('/account')"><b>●</b>Account</button></div><div class="toast" id="toast"></div><script>
const state={token:localStorage.getItem('fixgo_token'),user:JSON.parse(localStorage.getItem('fixgo_user')||'null'),vehicle:JSON.parse(localStorage.getItem('fixgo_vehicle')||'null')};
const $=id=>document.getElementById(id); async function api(path,opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})};if(state.token)h.Authorization='Bearer '+state.token;const r=await fetch('/api'+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>e.style.display='none',2200)}
function navigate(p){history.pushState({},'',p);renderRoute()}addEventListener('popstate',renderRoute);
function card(p){return `<article class="product"><img src="${p.image}" alt="${esc(p.name)}" loading="lazy"><div class="product-body"><div class="brand">${esc(p.brand)}</div><h3>${esc(p.name)}</h3><div class="stars">★★★★★ <span>${p.rating} (${p.reviews})</span></div><div class="fitbox">✓ ${p.compatible===false?'Check fitment':'Fits selected vehicle'}</div><div class="price">$${p.price.toFixed(2)} ${p.old_price?`<span class="old">$${p.old_price.toFixed(2)}</span>`:''}</div><div style="display:flex;gap:7px;margin-top:12px"><button class="btn primary" style="flex:1" onclick="addCart(${p.id})">ADD TO CART</button><button class="btn secondary" onclick="product(${p.id})">VIEW</button></div></div></article>`}
function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function home(){let d=await api('/products?vehicle='+encodeURIComponent(vehicleText()));let s=await api('/services');$('app').innerHTML=`<section class="hero"><div class="hero-inner"><div><span class="eyebrow">Parts • Services • Maintenance</span><h1>Get the Right Part.<br><span>Get Back on the Road.</span></h1><p>Fix&Go connects your vehicle, parts, mechanics and maintenance in one simple experience.</p><div class="actions"><button class="btn primary" onclick="navigate('/parts')">FIND CAR PARTS</button><button class="btn secondary" onclick="navigate('/mechanics')">BOOK A MECHANIC</button><button class="btn secondary" onclick="navigate('/maintenance')">MAINTAIN MY CAR</button></div></div>${vehicleSelector()}</div></section><section class="section"><div class="section-head"><div><h2>Everything your car needs</h2><div class="muted">One account. One garage. One place to manage your car.</div></div></div><div class="quick"><div class="quick-card" onclick="navigate('/parts')"><div class="iconbox">🔩</div><b>Parts Marketplace</b><p>Shop brakes, filters, engine parts, tires, batteries and more.</p></div><div class="quick-card" onclick="navigate('/garage')"><div class="iconbox">🚗</div><b>My Garage</b><p>Save vehicles, VINs, maintenance and repair history.</p></div><div class="quick-card" onclick="navigate('/ai-assistant')"><div class="iconbox">✦</div><b>AI Assistant</b><p>Get vehicle-aware guidance and find the right parts.</p></div><div class="quick-card" onclick="navigate('/mechanics')"><div class="iconbox">🔧</div><b>Mechanics & Installation</b><p>Find technicians, compare services and book appointments.</p></div></div></section><section class="section"><div class="section-head"><div><h2>Recommended for your vehicle</h2><div class="muted">Compatible products are prioritized.</div></div><button class="btn secondary" onclick="navigate('/parts')">View all</button></div><div class="products">${d.items.slice(0,4).map(card).join('')}</div></section><section class="section"><div class="wide-banner"><div><h3>Keep your maintenance on track</h3><p>Get reminders, service history and member benefits with Fix&Go Care.</p></div><button class="btn" style="background:#fff;color:var(--orange)" onclick="navigate('/maintenance/plans')">COMPARE PLANS</button></div></section>`;updateCartCount()}
function vehicleText(){return state.vehicle?`${state.vehicle.year} ${state.vehicle.make} ${state.vehicle.model}`:'2019 Toyota Corolla'}
function vehicleSelector(){let v=state.vehicle||{year:2019,make:'Toyota',model:'Corolla',engine:'1.8L Petrol'};return `<div class="vehicle-card"><h3>What's your vehicle?</h3><div class="sub">We'll prioritize parts and maintenance for your car.</div><div class="vehicle-grid"><select id="vy"><option>2019</option><option>2020</option><option>2021</option><option>2022</option></select><select id="vm"><option>Toyota</option><option>BMW</option><option>Honda</option><option>Ford</option></select><select id="vmo"><option>Corolla</option><option>Camry</option><option>RAV4</option><option>Focus</option></select><select id="ve"><option>1.8L Petrol</option><option>2.0L Petrol</option></select><button class="btn primary" style="grid-column:1/-1" onclick="saveVehicle()">SAVE MY VEHICLE</button></div><div class="muted" style="margin-top:10px">Current: ${esc(vehicleText())}</div></div>`}
async function saveVehicle(){const v={year:+$('vy').value,make:$('vm').value,model:$('vmo').value,engine:$('ve').value,fuel:'Petrol',transmission:'Automatic',is_default:true};state.vehicle=v;localStorage.setItem('fixgo_vehicle',JSON.stringify(v));if(state.token)try{await api('/garage',{method:'POST',body:JSON.stringify(v)})}catch{}toast('Vehicle saved');home()}
async function loadParts(search=''){let d=await api('/products?vehicle='+encodeURIComponent(vehicleText())+'&search='+encodeURIComponent(search));$('app').innerHTML=`<section class="catalog"><aside class="filters"><b>FILTERS</b><div class="filter-group"><b>Categories</b>${['Brakes','Engine','Filters','Tires','Electrical','Batteries','Belts'].map(x=>`<label><input type="checkbox" onchange="filterCategory('${x}',this.checked)"> ${x}</label>`).join('')}</div><div class="filter-group"><b>Brands</b>${['Bosch','Brembo','Denso','Valeo','Michelin','Gates','Yuasa'].map(x=>`<label><input type="checkbox" onchange="filterBrand('${x}',this.checked)"> ${x}</label>`).join('')}</div><div class="filter-group"><b>Availability</b><label><input type="checkbox" checked> In stock</label></div><button class="btn secondary" style="width:100%" onclick="loadParts('')">CLEAR ALL</button></aside><div><div class="sortbar"><div><h2 style="margin:0">Car Parts</h2><div class="muted">${d.items.length} results • ${esc(vehicleText())}</div></div><select onchange="sortParts(this.value)"><option value="recommended">Recommended</option><option value="popular">Best Selling</option><option value="low">Price Low → High</option><option value="high">Price High → Low</option><option value="rating">Best Rated</option><option value="newest">Newest</option><option value="discount">Biggest Discount</option></select></div><div id="catalogProducts" class="products">${d.items.map(card).join('')}</div></div></section>`}
let selectedFilters={};async function filterCategory(x,on){selectedFilters.category=on?x:'';reloadFilters()}async function filterBrand(x,on){selectedFilters.brand=on?x:'';reloadFilters()}async function reloadFilters(){let q=new URLSearchParams({vehicle:vehicleText(),...selectedFilters});let d=await api('/products?'+q);$('catalogProducts').innerHTML=d.items.map(card).join('')||`<div class="empty">No compatible products found. Try clearing a filter.</div>`}async function sortParts(v){let d=await api('/products?vehicle='+encodeURIComponent(vehicleText())+'&sort='+v);$('catalogProducts').innerHTML=d.items.map(card).join('')}
async function product(id){const p=await api('/products/'+id);$('app').innerHTML=`<div class="detail"><div><img class="detail-img" src="${p.image}" alt="${esc(p.name)}"></div><div class="detail-card"><div class="brand">${esc(p.brand)} • SKU ${esc(p.sku)}</div><h1>${esc(p.name)}</h1><div class="stars">★★★★★ ${p.rating} (${p.reviews})</div><div class="bigprice">$${p.price.toFixed(2)} <span class="old">$${p.old_price.toFixed(2)}</span></div><div class="fitbox">✓ FITS YOUR VEHICLE — ${esc(vehicleText())}</div><p>${esc(p.description)}</p><ul class="list"><li>Quality: ${esc(p.quality)}</li><li>Warranty: ${esc(p.warranty)}</li><li>Stock: ${p.stock} available</li><li>Delivery: Next day on qualifying orders</li></ul><div style="display:flex;gap:9px;margin-top:20px"><button class="btn primary" onclick="addCart(${p.id})">ADD TO CART</button><button class="btn secondary" onclick="addWish(${p.id})">♡ WISHLIST</button><button class="btn secondary" onclick="navigate('/installation')">BOOK INSTALLATION</button></div></div></div>`}
async function addCart(id){if(!state.token)return authPrompt();await api('/cart',{method:'POST',body:JSON.stringify({product_id:id,quantity:1})});toast('Added to cart');updateCartCount()}async function addWish(id){if(!state.token)return authPrompt();await api('/wishlist',{method:'POST',body:JSON.stringify({product_id:id})});toast('Saved to wishlist')}
async function updateCartCount(){if(!state.token){$('cartCount').textContent='0';return}try{const d=await api('/cart');$('cartCount').textContent=d.items.reduce((a,x)=>a+x.quantity,0)}catch{}}
function authPrompt(){navigate('/login')}
async function garage(){if(!state.token)return authPrompt();const d=await api('/garage');$('app').innerHTML=`<section class="section"><div class="section-head"><div><h2>My Garage</h2><div class="muted">Your vehicles power fitment, AI and maintenance.</div></div><button class="btn primary" onclick="showAddVehicle()">ADD VEHICLE</button></div><div class="account-grid">${d.vehicles.map(v=>`<div class="account-card"><b>${esc(v.year+' '+v.make+' '+v.model)}</b><p class="muted">${esc(v.engine||'')} • ${esc(v.fuel||'')} • ${v.is_default?'Default vehicle':''}</p><button class="btn secondary" onclick="setVehicle(${JSON.stringify(v).replace(/"/g,'&quot;')})">USE VEHICLE</button> <button class="btn secondary" onclick="deleteVehicle(${v.id})">Delete</button></div>`).join('')||`<div class="empty">No vehicles yet. Add your first vehicle.</div>`}</div><div id="garageForm"></div></section>`}
function showAddVehicle(){$('garageForm').innerHTML=`<div class="account-card" style="margin-top:15px"><h3>Add vehicle</h3><div class="vehicle-grid"><div class="field"><label>Year</label><input id="ay" value="2019"></div><div class="field"><label>Make</label><input id="am" value="Toyota"></div><div class="field"><label>Model</label><input id="amo" value="Corolla"></div><div class="field"><label>Trim</label><input id="at" value="LE"></div><div class="field"><label>Engine</label><input id="ae" value="1.8L Petrol"></div><div class="field"><label>VIN</label><input id="avin" placeholder="Optional"></div></div><button class="btn primary" onclick="addVehicle()">SAVE VEHICLE</button></div>`}async function addVehicle(){const v={year:+$('ay').value,make:$('am').value,model:$('amo').value,trim:$('at').value,engine:$('ae').value,vin:$('avin').value,is_default:false};await api('/garage',{method:'POST',body:JSON.stringify(v)});toast('Vehicle added');garage()}async function deleteVehicle(id){await api('/garage/'+id,{method:'DELETE'});garage()}function setVehicle(v){state.vehicle=v;localStorage.setItem('fixgo_vehicle',JSON.stringify(v));toast('Vehicle switched');navigate('/parts')}
async function cart(){if(!state.token)return authPrompt();const d=await api('/cart');$('app').innerHTML=`<section class="section"><div class="section-head"><div><h2>Your Cart</h2><div class="muted">Compatibility is checked against ${esc(vehicleText())}.</div></div></div>${d.items.length?`<div class="account-grid"><div style="grid-column:1/-1">${d.items.map(x=>`<div class="account-card" style="display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:10px"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.brand)} • Qty ${x.quantity}</div></div><b>$${(x.price*x.quantity).toFixed(2)}</b><button class="btn secondary" onclick="removeCart(${x.id})">Remove</button></div>`).join('')}</div><div class="account-card"><h3>Summary</h3><div style="display:flex;justify-content:space-between"><span>Subtotal</span><b>$${d.total.toFixed(2)}</b></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span>Delivery</span><b>$0.00</b></div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><div style="display:flex;justify-content:space-between;font-size:21px"><b>Total</b><b>$${d.total.toFixed(2)}</b></div><button class="btn primary" style="width:100%;margin-top:15px" onclick="checkout()">CHECKOUT</button></div></div>`:`<div class="empty">Your cart is empty. <button class="btn primary" onclick="navigate('/parts')">Shop parts</button></div>`}</section>`}async function removeCart(id){await api('/cart',{method:'DELETE',body:JSON.stringify({product_id:id})});cart();updateCartCount()}async function checkout(){const d=await api('/checkout',{method:'POST',body:JSON.stringify({})});toast('Order #'+d.order.id+' confirmed in demo mode');navigate('/orders')}
async function orders(){if(!state.token)return authPrompt();const d=await api('/orders');$('app').innerHTML=`<section class="section"><h2>Orders</h2><div class="muted" style="margin-bottom:18px">Track your Fix&Go purchases.</div>${d.orders.length?`<table class="table"><thead><tr><th>Order</th><th>Status</th><th>Total</th><th>Date</th></tr></thead><tbody>${d.orders.map(o=>`<tr><td>#${o.id}</td><td class="status">${o.status}</td><td>$${o.total.toFixed(2)}</td><td>${new Date(o.created_at).toLocaleDateString()}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">No orders yet.</div>`}</section>`}
async function maintenance(){const d=await api('/services');$('app').innerHTML=`<section class="section"><div class="section-head"><div><h2>Maintenance</h2><div class="muted">Service your vehicle with pay-as-you-go pricing or a plan.</div></div><button class="btn primary" onclick="navigate('/maintenance/plans')">VIEW PLANS</button></div><div class="services">${d.services.map(s=>`<div class="service"><div class="iconbox">⚙</div><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p><div class="price-line">${s.price_min===0?'Free':'$'+s.price_min.toFixed(0)+'–$'+s.price_max.toFixed(0)}</div><button class="btn primary" onclick="bookService(${s.id},'${esc(s.name)}')">BOOK</button></div>`).join('')}</div><div class="notice">Prices shown are configurable demo prices, not universal market prices. Final pricing can vary by city, vehicle and provider.</div></section>`}
async function bookService(id,name){if(!state.token)return authPrompt();const d=await api('/garage');if(!d.vehicles.length){toast('Add a vehicle first');return navigate('/garage')}const date=new Date(Date.now()+86400000*2).toISOString().slice(0,10);const time='10:00';await api('/bookings',{method:'POST',body:JSON.stringify({vehicle_id:d.vehicles[0].id,service_id:id,service_name:name,date,time,provider:'Fix&Go Central Garage',plan:'Pay-As-You-Go'})});toast('Booking confirmed');navigate('/account')}
async function plans(){const d=await api('/services');$('app').innerHTML=`<section class="section"><div class="section-head"><div><h2>Maintenance Plans</h2><div class="muted">Predictable benefits with real subscription state and usage tracking.</div></div></div><div class="plans">${d.plans.map(p=>`<div class="plan ${p.recommended?'recommended':''}">${p.recommended?'<div class="recommended-tag">RECOMMENDED</div>':''}<span class="tag">${p.name.toUpperCase()}</span><h3>${p.name==='Basic'?'Essential maintenance reminders':p.name==='Care'?'The best value for regular drivers':'Maximum coverage and savings'}</h3><div class="price-lg">$${p.monthly.toFixed(2)}<small style="font-size:13px"> / month</small></div><div class="annual">or $${p.annual.toFixed(2)} / year</div><ul class="list">${p.benefits.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><button class="btn ${p.recommended?'primary':'secondary'}" onclick="subscribe(${p.id},'${p.name}')">CHOOSE ${p.name.toUpperCase()}</button></div>`).join('')}</div></section>`}
async function subscribe(id,name){if(!state.token)return authPrompt();await api('/subscription',{method:'POST',body:JSON.stringify({plan_id:id,billing_cycle:'monthly'})});toast(name+' plan active in demo billing mode');navigate('/account')}
async function mechanics(){const names=[['Fix&Go Central Garage','Brakes • Oil • Tires • Diagnostics','4.9','182','$25'],['AutoPro Service Center','Maintenance • Batteries • Installation','4.8','146','$20'],['Prime Motor Works','Brakes • Suspension • Inspection','4.7','98','$30'],['City Auto Care','Tires • Oil • Filters • AC','4.8','121','$15']];$('app').innerHTML=`<section class="section"><h2>Find a Mechanic</h2><div class="muted" style="margin-bottom:20px">Verified-style demo providers with booking flow.</div><div class="services">${names.map(n=>`<div class="service"><div class="iconbox">🔧</div><h3>${n[0]}</h3><p>${n[1]}</p><div class="stars">★★★★★ <span>${n[2]} (${n[3]})</span></div><div class="price-line">From ${n[4]}</div><button class="btn primary" style="width:100%" onclick="navigate('/maintenance')">VIEW & BOOK</button></div>`).join('')}</div></section>`}
function installation(){$('app').innerHTML=`<section class="section"><h2>Book Installation</h2><div class="muted">Choose a product, location and appointment time.</div><div class="account-card" style="max-width:760px;margin-top:18px"><h3>Installation service</h3><div class="field"><label>Product</label><select id="ip"><option>Brembo Front Brake Pads</option><option>Bosch Premium Oil Filter</option><option>Yuasa AGM Battery</option></select></div><div class="vehicle-grid"><div class="field"><label>Location</label><select><option>Fix&Go Central Garage</option><option>AutoPro Service Center</option></select></div><div class="field"><label>Date</label><input id="idate" type="date"></div><div class="field"><label>Time</label><select><option>10:00</option><option>13:00</option><option>16:00</option></select></div></div><button class="btn primary" onclick="toast('Installation booking flow saved as demo');navigate('/account')">CONFIRM INSTALLATION</button></div></section>`;$('idate').value=new Date(Date.now()+86400000*2).toISOString().slice(0,10)}
function ai(){const msgs=JSON.parse(localStorage.getItem('fixgo_ai')||'[]');$('app').innerHTML=`<section class="section"><div style="max-width:900px;margin:auto"><h2>AI Automotive Assistant</h2><div class="muted">Vehicle-aware general guidance. Not a guaranteed professional diagnosis.</div><div class="messages" id="messages">${msgs.map(m=>`<div class="msg ${m.r}">${esc(m.t)}</div>`).join('')||'<div class="msg bot">Hi. I can help with parts, warning lights, maintenance and basic troubleshooting for '+esc(vehicleText())+'. What can I help with?</div>'}</div><div class="ai-row"><input id="aiInput" placeholder="Ask about brakes, oil, battery, a warning light..." onkeydown="if(event.key==='Enter')askAI()"><button class="btn primary" onclick="askAI()">ASK</button></div></div></section>`;$('aiInput').focus()}
async function askAI(){const i=$('aiInput'),v=i.value.trim();if(!v)return;const msgs=JSON.parse(localStorage.getItem('fixgo_ai')||'[]');msgs.push({r:'user',t:v});const d=await api('/ai',{method:'POST',body:JSON.stringify({message:v,vehicle:vehicleText()})});msgs.push({r:'bot',t:d.reply});localStorage.setItem('fixgo_ai',JSON.stringify(msgs.slice(-30)));ai()}
async function account(){if(!state.token)return authPrompt();const [sub,orders,bookings]=await Promise.all([api('/subscription'),api('/orders'),api('/bookings')]);$('app').innerHTML=`<section class="section"><div class="section-head"><div><h2>Account</h2><div class="muted">Welcome back, ${esc(state.user?.name||'Customer')}.</div></div><button class="btn secondary" onclick="logout()">LOG OUT</button></div><div class="account-grid"><div class="account-card"><b>My Garage</b><p class="muted">${esc(vehicleText())}</p><button class="btn secondary" onclick="navigate('/garage')">Open Garage</button></div><div class="account-card"><b>Orders</b><p class="muted">${orders.orders.length} total orders</p><button class="btn secondary" onclick="navigate('/orders')">View Orders</button></div><div class="account-card"><b>Maintenance Plan</b><p class="muted">${sub.subscription?esc(sub.subscription.plan_name)+' • '+sub.subscription.billing_cycle:'No active plan'}</p><button class="btn secondary" onclick="navigate('/maintenance/plans')">Manage Plan</button></div><div class="account-card"><b>Bookings</b><p class="muted">${bookings.bookings.length} bookings</p><button class="btn secondary" onclick="navigate('/maintenance')">Book Service</button></div><div class="account-card"><b>Wishlist</b><p class="muted">Saved parts</p><button class="btn secondary" onclick="toast('Wishlist is available from product pages')">Open</button></div><div class="account-card"><b>Support</b><p class="muted">Need help with an order?</p><button class="btn secondary" onclick="support()">Contact Support</button></div></div>${sub.subscription?`<div class="account-card" style="margin-top:18px"><h3>Plan benefits</h3><ul class="list">${sub.subscription.benefits.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="muted">Renews ${new Date(sub.subscription.renewal_at).toLocaleDateString()}</div></div>`:''}</section>`}
function support(){const s=prompt('What do you need help with?');if(!s)return;api('/support',{method:'POST',body:JSON.stringify({subject:'Customer support',message:s})}).then(()=>toast('Support ticket created')).catch(e=>toast(e.message))}
function authPage(register=false){$('app').innerHTML=`<section class="section"><div class="account-card" style="max-width:470px;margin:auto"><img src="/logo.png" style="width:125px" alt="Fix&Go"><h2>${register?'Create your Fix&Go account':'Welcome back'}</h2><div class="field"><label>Name</label><input id="authName" placeholder="Your name" ${register?'':'style="display:none"'}></div><div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="authPass" type="password" placeholder="8+ characters"></div><button class="btn primary" style="width:100%" onclick="submitAuth(${register})">${register?'CREATE ACCOUNT':'LOG IN'}</button><p class="muted" style="margin-top:15px">${register?'Already have an account?':'Need an account?'} <button class="btn secondary" onclick="navigate('/${register?'login':'register'}')">${register?'Log in':'Register'}</button></p><div class="notice">Development authentication is active. Production OAuth/email verification can be connected through the server adapters.</div></div></section>`}
async function submitAuth(reg){try{const d=await api('/auth/'+(reg?'register':'login'),{method:'POST',body:JSON.stringify({name:$('authName').value,email:$('authEmail').value,password:$('authPass').value})});state.token=d.token;state.user=d.user;localStorage.setItem('fixgo_token',d.token);localStorage.setItem('fixgo_user',JSON.stringify(d.user));toast('Welcome to Fix&Go');navigate('/')}catch(e){toast(e.message)}}function logout(){state.token=null;state.user=null;localStorage.removeItem('fixgo_token');localStorage.removeItem('fixgo_user');navigate('/')}
async function admin(){if(!state.token)return authPrompt();try{const d=await api('/admin');$('app').innerHTML=`<section class="section"><h2>Admin Dashboard</h2><div class="muted" style="margin-bottom:18px">Operational overview for marketplace, services and maintenance.</div><div class="account-grid"><div class="account-card"><b>Products</b><h2>${d.stats.products}</h2></div><div class="account-card"><b>Customers</b><h2>${d.stats.users}</h2></div><div class="account-card"><b>Orders</b><h2>${d.stats.orders}</h2></div><div class="account-card"><b>Revenue</b><h2>$${Number(d.stats.revenue).toFixed(2)}</h2></div><div class="account-card"><b>Active Plans</b><h2>${d.stats.subscriptions}</h2></div></div><div style="margin-top:20px"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Total</th></tr></thead><tbody>${d.orders.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.email)}</td><td class="status">${o.status}</td><td>$${o.total.toFixed(2)}</td></tr>`).join('')}</tbody></table></div></section>`}catch(e){toast(e.message)}}
async function renderRoute(){const p=location.pathname.replace(/\/$/,'')||'/';try{if(p==='/')return home();if(p==='/parts')return loadParts('');if(p.startsWith('/parts/'))return product(Number(p.split('/').pop()));if(p==='/garage')return garage();if(p==='/ai-assistant')return ai();if(p==='/mechanics')return mechanics();if(p==='/installation')return installation();if(p==='/maintenance')return maintenance();if(p==='/maintenance/plans')return plans();if(p==='/cart')return cart();if(p==='/orders'||p.startsWith('/orders/'))return orders();if(p==='/account')return account();if(p==='/support')return support();if(p==='/login')return authPage(false);if(p==='/register')return authPage(true);if(p==='/admin')return admin();$('app').innerHTML='<section class="section"><div class="empty"><h2>Page not found</h2><button class="btn primary" onclick="navigate(\'/\')">Go home</button></div></section>'}catch(e){console.error(e);$('app').innerHTML=`<section class="section"><div class="empty"><h2>Something went wrong</h2><p>${esc(e.message)}</p><button class="btn primary" onclick="navigate('/')">Try again</button></div></section>`}}
renderRoute();
</script></body></html>
